name: backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate public deployment entry without a daemon
        run: docker compose --env-file .env.example -f compose.yml config --quiet
      - name: Validate checked-in monitoring configuration
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.4.2 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/amtool prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml
      - run: chmod +x mvnw && ./mvnw -B -ntp -Dmaven.compiler.fork=true verify
      - run: python3 -m unittest discover -s ops/monitoring -p 'test_*.py'
      - run: python3 -m unittest discover -s ops/release -p 'test_*.py'
      - run: python3 -m unittest discover -s ops/backup -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s agent-rag-service/evaluation -p 'test_*.py'
      - run: python3 scripts/check-doc-links.py
      - run: sh ops/backup/build-helper.sh agent-rag-service/target/agent-rag-service-0.0.1-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
