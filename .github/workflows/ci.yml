name: backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
      - run: python3 -m unittest discover -s ops/monitoring -p 'test_*.py'
      - run: python3 -m unittest discover -s ops/release -p 'test_*.py'
      - run: python3 -m unittest discover -s ops/backup -p 'test_*.py'
      - run: sh ops/backup/build-helper.sh agent-rag-service/target/agent-rag-service-0.0.1-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
