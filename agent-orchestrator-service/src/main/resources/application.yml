spring:
  application.name: agent-orchestrator-service
  config.import: optional:nacos:agent-orchestrator-service.yml?group=AGENT_GROUP&refreshEnabled=true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:agent}
    password: ${MYSQL_PASSWORD:change-me}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_orchestrator
  cloud:
    compatibility-verifier.enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
server:
  port: ${SERVER_PORT:18084}
  shutdown: graceful
app:
  chat:
    base-url: ${CHAT_SERVICE_URL:http://127.0.0.1:18085}
  rag:
    base-url: ${RAG_SERVICE_URL:http://127.0.0.1:18086}
  media:
    base-url: ${MEDIA_SERVICE_URL:http://127.0.0.1:18082}
  security:
    internal-principal-secrets: ${INTERNAL_PRINCIPAL_SECRETS:}
    internal-principal-active-key-id: ${INTERNAL_PRINCIPAL_ACTIVE_KEY_ID:current}
    default-tenant-id: ${DEFAULT_TENANT_ID:local}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://127.0.0.1:18081}
    session-cookie: ${AUTH_SESSION_COOKIE:bbb_agent_session}
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
  tracing:
    sampling.probability: ${TRACING_SAMPLE_RATE:0.1}
    export.zipkin.endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
