spring:
  application:
    name: agent-gateway
  config:
    import: optional:nacos:agent-gateway.yml?group=AGENT_GROUP&refreshEnabled=true
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
        port: ${SENTINEL_CLIENT_PORT:8719}
  main:
    web-application-type: reactive
server:
  port: ${SERVER_PORT:18000}
  shutdown: graceful
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.boboo.xin,https://boboo.xin,http://localhost:*,http://127.0.0.1:*}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://127.0.0.1:18081}
  security:
    internal-principal-secrets: ${INTERNAL_PRINCIPAL_SECRETS:}
    internal-principal-active-key-id: ${INTERNAL_PRINCIPAL_ACTIVE_KEY_ID:current}
    session-cookie-name: ${SESSION_COOKIE_NAME:bbb_agent_session}
    default-tenant-id: ${DEFAULT_TENANT_ID:local}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
