# Optional override, used together with infra/docker-compose.yml and docker-compose.app.yml.
# Does not import data or contact a model until an administrator explicitly requests it.
services:
  agent-rag-service:
    environment:
      SPRING_PROFILES_ACTIVE: ${RAG_ACTIVE_PROFILES:-gallery}
      PROMPT_GALLERY_ENABLED: "true"
      PROMPT_GALLERY_CHAT_ENABLED: ${PROMPT_GALLERY_CHAT_ENABLED:-false}
      PROMPT_GALLERY_SOURCE_ROOT: /opt/prompt-gallery
      PROMPT_GALLERY_SOURCE_COMMIT: ${PROMPT_GALLERY_SOURCE_COMMIT:-9f8aa1a44a4a5c0f5a5d6e45eed564b3e2d5b87f}
      PROMPT_GALLERY_COLLECTION: ${PROMPT_GALLERY_COLLECTION:-agent_prompt_gallery_openai_small_1536_v1}
      PROMPT_GALLERY_EMBEDDING_SPACE: ${PROMPT_GALLERY_EMBEDDING_SPACE:-openai/text-embedding-3-small/v1}
      PROMPT_GALLERY_DIMENSIONS: ${PROMPT_GALLERY_DIMENSIONS:-1536}
      PROMPT_GALLERY_EMBEDDING_MODEL: ${PROMPT_GALLERY_EMBEDDING_MODEL:-text-embedding-3-small}
      PROMPT_GALLERY_CHAT_MODEL: ${PROMPT_GALLERY_CHAT_MODEL:-gpt-4.1-mini}
      PROMPT_GALLERY_MAX_CONCURRENT: ${PROMPT_GALLERY_MAX_CONCURRENT:-2}
      PROMPT_GALLERY_MAX_REQUESTS_PER_MINUTE: ${PROMPT_GALLERY_MAX_REQUESTS_PER_MINUTE:-10}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ${PROMPT_GALLERY_SOURCE_DIR:?Set PROMPT_GALLERY_SOURCE_DIR to a pinned source checkout}:/opt/prompt-gallery:ro
