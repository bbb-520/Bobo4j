server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  shutdown: graceful

spring:
  application:
    name: agent-chat-service
  config:
    import: optional:nacos:agent-chat-service.yml?group=AGENT_GROUP&refreshEnabled=true
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
        port: ${SENTINEL_CLIENT_PORT:8720}
  main:
    web-application-type: reactive
  # API keys are user-scoped and loaded per request. Do not create the
  # unused singleton OpenAI clients, which require a server-wide key at boot.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  codec:
    # 图片编辑接口默认允许 10 MB 源图，并留出 multipart / JSON 包装余量。
    max-in-memory-size: 12MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bobo_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:bobo_user}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # schema.sql 由本地初始化脚本显式执行，避免应用启动时因数据库权限导致不可控建表。
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 10s
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      timeout: 60s
      max-retries: 2
      chat:
        model: qwen-turbo   # 或 qwen-plus / qwen-max
        # 图片消息使用兼容 OpenAI multimodal content 的视觉模型。
        vision-model: ${QWEN_VISION_MODEL:qwen-vl-plus}
    chat:
      memory:
        repository:
          redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            key-prefix: "chat:memory:"
            # 会话记忆在 Redis 中的存活时间：只保存对话，到期自动清理
            time-to-live: 7d
            # 启动时自动建立记忆 JSON 索引
            initialize-schema: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    org.springframework.ai: INFO
    org.springframework.ai.chat.client: INFO

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  legacy:
    read-only: ${LEGACY_READ_ONLY:true}
  oss:
    enabled: ${OSS_ENABLED:true}
    region: ${ALIYUN_OSS_REGION:cn-beijing}
    bucket: ${ALIYUN_OSS_BUCKET:bbb-image-prod}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    source-prefix: ${OSS_SOURCE_PREFIX:source}
    output-prefix: ${OSS_OUTPUT_PREFIX:output}
    thumbnail-prefix: ${OSS_THUMBNAIL_PREFIX:thumbnail}
    archive-prefix: ${OSS_ARCHIVE_PREFIX:one and one}
    upload-policy-ttl: ${OSS_UPLOAD_POLICY_TTL:600s}
    signed-url-ttl: ${OSS_SIGNED_URL_TTL:600s}
    max-object-bytes: ${OSS_MAX_OBJECT_BYTES:20971520}
  zine:
    enabled: ${ZINE_ENABLED:true}
    base-url: ${ZINE_IMAGE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    endpoint: ${ZINE_IMAGE_ENDPOINT:/services/aigc/multimodal-generation/generation}
    model: ${ZINE_IMAGE_MODEL:qwen-image-3.0-pro}
    size: ${ZINE_IMAGE_SIZE:1024*1707}
    prompt-extend: ${ZINE_PROMPT_EXTEND:true}
    watermark: ${ZINE_WATERMARK:false}
    timeout: ${ZINE_IMAGE_TIMEOUT:180s}
    max-upload-bytes: ${ZINE_MAX_UPLOAD_BYTES:20971520}
  image-jobs:
    enabled: ${LEGACY_IMAGE_JOBS_ENABLED:false}
    poll-interval: ${IMAGE_JOBS_POLL_INTERVAL:3000ms}
    max-attempts: ${IMAGE_JOBS_MAX_ATTEMPTS:2}
  security:
    api-key-encryption-key: ${API_KEY_ENCRYPTION_KEY:}
    # 未接入登录系统时，使用 HttpOnly 匿名 Cookie 维持本地实验用户边界。
    anonymous-cookie-name: bbb_agent_anonymous_id
    session-cookie-name: bbb_agent_session
    default-tenant-id: local
