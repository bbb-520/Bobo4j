spring:
  application.name: agent-chat-service
  config.import: optional:nacos:agent-chat-service.yml?group=AGENT_GROUP&refreshEnabled=true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:agent}
    password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-redis-me}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history_chat
  cloud:
    compatibility-verifier.enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: AGENT_GROUP
  codec:
    max-in-memory-size: 12MB
server:
  port: ${SERVER_PORT:18085}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
app:
  chat:
    # Conservative UTF-8 bytes, additionally capped at 20 messages / 32000 rendered characters.
    history-token-limit: ${CHAT_HISTORY_TOKEN_LIMIT:96000}
  vision-memory:
    dimensions: ${VISION_MEMORY_DIMENSIONS:1024}
    similarity-threshold: ${VISION_MEMORY_SIMILARITY_THRESHOLD:0.55}
  security:
    internal-principal-secrets: ${INTERNAL_PRINCIPAL_SECRETS:}
    internal-principal-active-key-id: ${INTERNAL_PRINCIPAL_ACTIVE_KEY_ID:current}
    anonymous-cookie-name: ${ANONYMOUS_COOKIE_NAME:bbb_agent_anonymous_id}
    session-cookie-name: ${SESSION_COOKIE_NAME:bbb_agent_session}
    default-tenant-id: ${DEFAULT_TENANT_ID:local}
  auth:
    base-url: ${AUTH_SERVICE_URL:http://127.0.0.1:18081}
  media:
    base-url: ${MEDIA_SERVICE_URL:http://127.0.0.1:18082}
  oss:
    enabled: ${OSS_ENABLED:false}
    region: ${ALIYUN_OSS_REGION:cn-beijing}
    bucket: ${ALIYUN_OSS_BUCKET:}
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    source-prefix: ${OSS_SOURCE_PREFIX:source}
    output-prefix: ${OSS_OUTPUT_PREFIX:output}
    thumbnail-prefix: ${OSS_THUMBNAIL_PREFIX:thumbnail}
    archive-prefix: ${OSS_ARCHIVE_PREFIX:archive}
    upload-policy-ttl: ${OSS_UPLOAD_POLICY_TTL:600s}
    signed-url-ttl: ${OSS_SIGNED_URL_TTL:600s}
    max-object-bytes: ${OSS_MAX_OBJECT_BYTES:20971520}
logging:
  pattern:
    # F14：关联字段进日志。空值显示为空而不是 "null"。
    console: "%d{ISO8601} %-5level [%X{requestId:-}] [%X{traceId:-}] [%X{executionId:-}] [%X{callId:-}] %logger{36} - %msg%n"
