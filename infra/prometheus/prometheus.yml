global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/operations-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: agent-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [agent-gateway:18000,agent-auth-service:18081,agent-media-service:18082,agent-content-service:18083,agent-orchestrator-service:18084,agent-chat-service:18085,agent-rag-service:18086]
  - job_name: milvus
    metrics_path: /metrics
    static_configs:
      - targets: [milvus:9091]
  - job_name: bobo-operations
    static_configs:
      - targets: [host.docker.internal:19110]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
